name: ECS Unit Tests

on:
  push:
    paths:
      - 'addons/pgdecs/**'
      - '.github/workflows/ecs-tests.yml'
  pull_request:
    paths:
      - 'addons/pgdecs/**'
      - '.github/workflows/ecs-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.0
          use-dotnet: false
          include-templates: false

      - name: Import project
        run: godot --headless --path . --import

      - name: Run Composer quality gates
        run: godot --headless --path . --script res://addons/pgdecs/ecs/tests/run_composer_gates_headless.gd
